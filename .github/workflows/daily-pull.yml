name: Daily — pull NHTSA + fetch new car photos

on:
  schedule:
    # 04:15 UTC daily (after most North American manufacturers' VPIC updates)
    - cron: "15 4 * * *"
  workflow_dispatch: {}   # also runnable on-demand

permissions:
  contents: write          # to commit changes back

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  pull-and-fetch:
    runs-on: ubuntu-latest
    # v2026.05.30 — budget bumped 20 → 60 min to accommodate VMMRdb / Mapillary /
    # OpenImages / auctions / corrections pulls layered on top of NHTSA + Wikimedia.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull NHTSA VPIC (find new makes/models)
        run: python pipeline/nhtsa_pull.py
        env:
          VOV_PIPELINE_DATA: ${{ github.workspace }}/pipeline/data

      - name: Fetch Wikimedia photos (pending + supplement)
        run: python pipeline/wikimedia_fetch.py
        env:
          VOV_PIPELINE_DATA: ${{ github.workspace }}/pipeline/data
          # Knobs (see wikimedia_fetch.py header):
          VOV_WIKIMEDIA_MAX:                100
          VOV_WIKIMEDIA_MODELS_PER_RUN:     200
          VOV_WIKIMEDIA_SUPPLEMENT_TARGET:  80
          VOV_WIKIMEDIA_SUPPLEMENT_BUDGET:  100

      - name: LLM auto-filter (skips if no API key set)
        run: python pipeline/llm_filter.py
        env:
          VOV_PIPELINE_DATA: ${{ github.workspace }}/pipeline/data
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}    # free tier — 1500 req/day

      # v2026.05.30 — Wave 2 photo sources. Each step is independently optional
      # and gracefully no-ops without its credential/env var. Order matters
      # only insofar as each writes to a distinct pipeline/data/photos/<src>/
      # subdir; train.py walks them all later.

      - name: VMMRdb bulk import (one-shot, 291K photos / 9K classes)
        run: python pipeline/vmmrdb_pull.py
        env:
          VOV_PIPELINE_DATA: ${{ github.workspace }}/pipeline/data
          # Optional: override mirror URL if the maintainer URL rotates.
          VOV_VMMRDB_URL:    ${{ secrets.VOV_VMMRDB_URL }}

      # v2026-05-31 — Commit BEFORE the slow downloaders below so a runaway
       # step or 60-min job timeout doesn't lose the upstream work (NHTSA,
       # Wikimedia, VMMRdb were dropping on the floor when OpenImages exceeded
       # its budget). Cheap to commit twice in one run; git noticeably skips
       # empty commits via `git diff --staged --quiet`.
      - name: Commit upstream changes (NHTSA + Wikimedia + VMMRdb)
        if: always()
        run: |
          git config user.name  "vov-pipeline-bot"
          git config user.email "pipeline@valetops.com"
          find pipeline/data -size +95M -print -delete || true
          git add pipeline/data/
          git diff --staged --quiet || git commit -m "pipeline: upstream daily pull $(date -u +%Y-%m-%d)"
          git push || true

      - name: OpenImages V6 'Car' subclass (unlabeled staging)
        # v2026-05-31 — per-step timeout so this can't eat the whole job.
        # Previous run #7 spent 38 min here and got cancelled at 60-min job cap;
        # capping per-step + dropping budget 1000 → 200 keeps it well-bounded.
        timeout-minutes: 10
        continue-on-error: true
        run: python pipeline/openimages_pull.py
        env:
          VOV_PIPELINE_DATA:       ${{ github.workspace }}/pipeline/data
          VOV_OPENIMAGES_BUDGET:   200

      - name: Mapillary street-view photos (unlabeled staging)
        timeout-minutes: 10
        continue-on-error: true
        run: python pipeline/mapillary_pull.py
        env:
          VOV_PIPELINE_DATA:     ${{ github.workspace }}/pipeline/data
          VOV_MAPILLARY_TOKEN:   ${{ secrets.VOV_MAPILLARY_TOKEN }}
          VOV_MAPILLARY_BUDGET:  500

      - name: Auction listings (IAA + Copart, opt-in)
        timeout-minutes: 15
        continue-on-error: true
        run: python pipeline/auctions_pull.py
        env:
          VOV_PIPELINE_DATA:           ${{ github.workspace }}/pipeline/data
          VOV_AUCTIONS_OPT_IN:         ${{ secrets.VOV_AUCTIONS_OPT_IN }}
          VOV_AUCTIONS_PER_MAKE:       25
          VOV_AUCTIONS_MAKES_PER_RUN:  30

      - name: Pull driver corrections from worker /v1/export
        timeout-minutes: 5
        continue-on-error: true
        run: python pipeline/corrections_pull.py
        env:
          VOV_PIPELINE_DATA:        ${{ github.workspace }}/pipeline/data
          VOV_CORRECTIONS_TOKEN:    ${{ secrets.VOV_CORRECTIONS_TOKEN }}
          VOV_CORRECTIONS_URL:      ${{ secrets.VOV_CORRECTIONS_URL }}

      # Final commit catches everything from the downstream sources. if:always()
      # ensures it runs even if a step above failed or was cancelled.
      - name: Commit downstream changes (OpenImages + Mapillary + Auctions + Corrections)
        if: always()
        run: |
          git config user.name  "vov-pipeline-bot"
          git config user.email "pipeline@valetops.com"
          find pipeline/data -size +95M -print -delete || true
          git add pipeline/data/
          git diff --staged --quiet || git commit -m "pipeline: downstream daily pull $(date -u +%Y-%m-%d)"
          git push || true
